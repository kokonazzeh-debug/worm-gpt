<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZZEH AI - AI chat interface">
  <title>NAZZEH AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div>
          <strong>NAZZEH AI</strong>
          <span>by nazzeh el founder</span>
        </div>
      </div>

      <button class="new-chat" id="newChat">＋ محادثة جديدة</button>

      <div class="side-title">الموديل</div>
      <select id="modelSelect" class="model-select">
        <option value="meta-llama/Llama-3.2-3B-Instruct">Llama 3.2 3B Instruct</option>
        <option value="mistralai/Mistral-7B-Instruct-v0.3">Mistral 7B Instruct</option>
        <option value="Qwen/Qwen2.5-7B-Instruct">Qwen 2.5 7B Instruct</option>
      </select>

      <div class="side-title">المحادثات</div>
      <div id="history" class="history"></div>

      <div class="sidebar-bottom">
        <div class="founder">nazzeh el founder</div>
        <div class="status"><i></i> واجهة جاهزة</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn">☰</button>
        <div>
          <div class="top-title">NAZZEH AI</div>
          <div class="top-subtitle" id="modelLabel">Hugging Face model</div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="clearBtn" title="مسح المحادثة">⌫</button>
        </div>
      </header>

      <section class="chat" id="chat"></section>

      <div class="composer-wrap">
        <div id="filePreview" class="file-preview hidden"></div>
        <form class="composer" id="composer">
          <label class="attach" title="رفع ملف">
            📎
            <input id="fileInput" type="file" hidden>
          </label>
          <textarea id="prompt" rows="1" placeholder="اكتب رسالتك إلى NAZZEH AI..." autocomplete="off"></textarea>
          <button class="send" id="sendBtn" type="submit" title="إرسال">➤</button>
        </form>
        <div class="hint">NAZZEH AI قد يخطئ. راجع المعلومات المهمة قبل الاعتماد عليها.</div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
